ct x='962' y='330' width='200' height='64' rx='8' fill='#e7f0fb' stroke='#0b6bcb' stroke-width='1.5'/><text x='1062' y='356' font-size='16' font-weight='650' fill='#1f2328' text-anchor='middle'>collect()</text><text x='1062' y='378' font-size='12' font-weight='400' fill='#57606a' text-anchor='middle'>streaming by default in 2.x</text><text x='692' y='428' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>projection pushdown: read only needed columns</text><text x='692' y='450' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>predicate pushdown: filter while reading, before joins</text><text x='692' y='472' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>one result DataFrame at the end</text></svg>