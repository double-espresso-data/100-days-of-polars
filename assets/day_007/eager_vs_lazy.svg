<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 500' width='1200' height='500' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' role='img' aria-label='Eager runs each step; lazy plans the whole query first' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width='1200' height='500' fill='#ffffff'/><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker><marker id='arrA' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0b6bcb'/></marker></defs><text x='40' y='52' font-size='24' font-weight='650' fill='#1f2328' text-anchor='start'>Eager runs each step; lazy plans the whole query first</text><text x='40' y='112' font-size='18' font-weight='650' fill='#c4432b' text-anchor='start'>Eager</text><text x='40' y='134' font-size='14' font-weight='400' fill='#57606a' text-anchor='start'>every step materializes a full DataFrame</text><rect x='40' y='152' width='170' height='46' rx='6' fill='#fbeae7' stroke='#c4432b' stroke-width='1.25'/><text x='125' y='181' font-size='15' font-weight='600' fill='#1f2328' text-anchor='middle'>read / scan</text><rect x='60' y='210' width='130' height='30' rx='4' fill='#ffffff' stroke='#8c959f' stroke-width='1' stroke-dasharray='4 3'/><text x='125' y='230' font-size='12' font-weight='400' fill='#57606a' text-anchor='middle'>DataFrame</text><line x1='210' y1='175' x2='266' y2='175' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arr)'/><rect x='268' y='152' width='170' height='46' rx='6' fill='#fbeae7' stroke='#c4432b' stroke-width='1.25'/><text x='353' y='181' font-size='15' font-weight='600' fill='#1f2328' text-anchor='middle'>join</text><rect x='288' y='210' width='130' height='30' rx='4' fill='#ffffff' stroke='#8c959f' stroke-width='1' stroke-dasharray='4 3'/><text x='353' y='