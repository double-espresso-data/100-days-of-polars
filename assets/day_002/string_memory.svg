<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 560' width='1200' height='560' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' role='img' aria-label='Same text column, two memory layouts' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width='1200' height='560' fill='#ffffff'/><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker><marker id='arrA' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0b6bcb'/></marker></defs><text x='40' y='52' font-size='24' font-weight='650' fill='#1f2328' text-anchor='start'>Same text column, two memory layouts</text><text x='40' y='80' font-size='15' font-weight='400' fill='#57606a' text-anchor='start'>customer_city = ['sao paulo', 'campinas', None, ...]</text><rect x='30' y='105' width='560' height='430' rx='10' fill='#fafbfc' stroke='#d0d7de' stroke-width='1.25'/><text x='54' y='140' font-size='18' font-weight='650' fill='#c4432b' text-anchor='start'>pandas object column</text><text x='54' y='162' font-size='14' font-weight='400' fill='#57606a' text-anchor='start'>an array of pointers to separate Python objects</text><rect x='54' y='190' width='70' height='34' rx='4' fill='#fbeae7' stroke='#c4432b' stroke-width='1.25'/><text x='89' y='212' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>8 B</text><rect x='54' y='234' width='70' height='34' rx='4' fill='#fbeae7' stroke='#c4432b' stroke-width='1.25'/><text x='89' y='256' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>8 B</text><rect x='54' y='278' width='70' height='34' rx='4' fill='#fbeae7' stroke='#c4432b' stroke-width='1.25'/><text x='89' y='300' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>None</text><rect x='54' y='322' width='70' height='34' rx='4' fill='#fbeae7' stroke='#c4432b' stroke-width='1.25'/><text x='89' y='344' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>8 B</text><rect x='250' y='180' width='230' height='58' rx='6' fill='#ffffff' stroke='#8c959f' stroke-width='1.25'/><text x='262' y='203' font-size='13' font-weight='400' fill='#57606a' text-anchor='start'>PyObject header ~50 B</text><text x='262' y='225' font-size='14' font-weight='600' fill='#1f2328' text-anchor='start'>'sao paulo'</text><line x1='124' y1='207' x2='250' y2='209' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arr)'/><rect x='330' y='262' width='230' height='58' rx='6' fill='#ffffff' stroke='#8c959f' stroke-width='1.25'/><text x='342' y='285' font-size='13' font-weight='400' fill='#57606a' text-anchor='start'>PyObject header ~50 B</text><text x='342' y='307' font-size='14' font-weight='600' fill='#1f2328' text-anchor='start'>'campinas'</text><line x1='124' y1='251' x2='330' y2='291' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arr)'/><rect x='250' y='344' width='230' height='58' rx='6' fill='#ffffff' stroke='#8c959f' stroke-width='1.25'/><text x='262' y='367' font-size='13' font-weight='400' fill='#57606a' text-anchor='start'>PyObject header ~50 B</text><text x='262' y='389' font-size='14' font-weight='600' fill='#1f2328' text-anchor='start'>'sao paulo'</text><line x1='124' y1='339' x2='250' y2='373' stroke='#8c959f' stroke-width='1.25' marker-end='url(#arr)'/><text x='54' y='450' font-size='14' font-weight='400' fill='#1f2328' text-anchor='start'>• one heap object per value, scattered in memory</text><text x='54' y='474' font-size='14' font-weight='400' fill='#1f2328' text-anchor='start'>• every read follows a pointer (cache misses)</text><text x='54' y='498' font-size='14' font-weight='400' fill='#1f2328' text-anchor='start'>• same value stored again and again</text><rect x='620' y='105' width='550' height='430' rx='10' fill='#f6f9fe' stroke='#0b6bcb' stroke-width='1.5'/><text x='644' y='140' font-size='18' font-weight='650' fill='#0b6bcb' text-anchor='start'>Arrow column (Polars String)</text><text x='644' y='162' font-size='14' font-weight='400' fill='#57606a' text-anchor='start'>a few contiguous buffers per column</text><text x='644' y='196' font-size='14' font-weight='600' fill='#1f2328' text-anchor='start'>validity bitmap · 1 bit per row</text><rect x='644' y='206' width='26' height='28' rx='3' fill='#e7f0fb' stroke='#0b6bcb' stroke-width='1.25'/><text x='657' y='225' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>1</text><rect x='674' y='206' width='26' height='28' rx='3' fill='#e7f0fb' stroke='#0b6bcb' stroke-width='1.25'/><text x='687' y='225' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>1</text><rect x='704' y='206' width='26' height='28' rx='3' fill='#ffffff' stroke='#0b6bcb' stroke-width='1.25'/><text x='717' y='225' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>0</text><rect x='734' y='206' width='26' height='28' rx='3' fill='#e7f0fb' stroke='#0b6bcb' stroke-width='1.25'/><text x='747' y='225' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>1</text><rect x='764' y='206' width='26' height='28' rx='3' fill='#e7f0fb' stroke='#0b6bcb' stroke-width='1.25'/><text x='777' y='225' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>1</text><rect x='794' y='206' width='26' height='28' rx='3' fill='#e7f0fb' stroke='#0b6bcb' stroke-width='1.25'/><text x='807' y='225' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>1</text><rect x='824' y='206' width='26' height='28' rx='3' fill='#ffffff' stroke='#0b6bcb' stroke-width='1.25'/><text x='837' y='225' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>0</text><rect x='854' y='206' width='26' height='28' rx='3' fill='#e7f0fb' stroke='#0b6bcb' stroke-width='1.25'/><text x='867' y='225' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>1</text><text x='644' y='268' font-size='14' font-weight='600' fill='#1f2328' text-anchor='start'>views · 16 B each: length + string inline (≤ 12 B)</text><rect x='644' y='280' width='48' height='30' rx='3' fill='#e7f0fb' stroke='#0b6bcb' stroke-width='1.25'/><text x='668' y='300' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>9</text><rect x='696' y='280' width='190' height='30' rx='3' fill='#e7f0fb' stroke='#0b6bcb' stroke-width='1.25'/><text x='706' y='300' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>sao paulo</text><rect x='644' y='316' width='48' height='30' rx='3' fill='#e7f0fb' stroke='#0b6bcb' stroke-width='1.25'/><text x='668' y='336' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>8</text><rect x='696' y='316' width='190' height='30' rx='3' fill='#e7f0fb' stroke='#0b6bcb' stroke-width='1.25'/><text x='706' y='336' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>campinas</text><rect x='644' y='352' width='48' height='30' rx='3' fill='#e7f0fb' stroke='#0b6bcb' stroke-width='1.25'/><text x='668' y='372' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>0</text><rect x='696' y='352' width='190' height='30' rx='3' fill='#e7f0fb' stroke='#0b6bcb' stroke-width='1.25'/><text x='706' y='372' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'></text><rect x='644' y='388' width='48' height='30' rx='3' fill='#e7f0fb' stroke='#0b6bcb' stroke-width='1.25'/><text x='668' y='408' font-size='13' font-weight='600' fill='#1f2328' text-anchor='middle'>9</text><rect x='696' y='388' width='190' height='30' rx='3' fill='#e7f0fb' stroke='#0b6bcb' stroke-width='1.25'/><text x='706' y='408' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>sao paulo</text><text x='910' y='300' font-size='13' font-weight='400' fill='#57606a' text-anchor='start'>long strings: prefix + offset</text><text x='910' y='318' font-size='13' font-weight='400' fill='#57606a' text-anchor='start'>into one shared data buffer</text><text x='644' y='450' font-size='14' font-weight='400' fill='#1f2328' text-anchor='start'>• whole column in one block: CPU prefetch and SIMD</text><text x='644' y='474' font-size='14' font-weight='400' fill='#1f2328' text-anchor='start'>• nulls cost 1 bit, not an object</text><text x='644' y='498' font-size='14' font-weight='400' fill='#1f2328' text-anchor='start'>• shared with pandas 3, DuckDB, PyArrow without copying</text></svg>